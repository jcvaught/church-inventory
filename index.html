<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChurchOpsHub — Run Your Church</title>
    <meta name="description" content="ChurchOpsHub — The operations platform built for churches. Track inventory, supplies, reservations, maintenance, and more." />
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChurchOpsHub" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      input:focus, select:focus, textarea:focus {
        border-color: #2A7D6E !important;
        box-shadow: 0 0 0 3px rgba(42,125,110,0.12) !important;
        outline: none;
      }
      /* Prevent iOS Safari from auto-zooming inputs with font-size < 16px */
      @supports (-webkit-touch-callout: none) {
        input, select, textarea { font-size: 16px !important; }
      }
      /* Auto-dismiss toast countdown bar */
      @keyframes coh-toast-countdown {
        from { width: 100%; }
        to   { width: 0%; }
      }
    </style>
  </head>
  <body style="margin:0;background:#FAFAF7;overscroll-behavior:none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration is best-effort; the app works fully
      // without it (just no PWA install + no offline shell). Failure here
      // is invisible to the user and only happens in restrictive client
      // environments (private mode / storage-blocked / bots) — server
      // assets all serve correctly. Log at WARN (not error) so Sentry's
      // captureConsole({levels:['error']}) doesn't file it as an error-
      // level issue, but keep err.name so it stays diagnosable in-console.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn(
              '[ChurchOpsHub] Service worker registration skipped:',
              (err && err.name) || 'Error',
              err && (err.message || String(err))
            );
          });
        });
      }
    </script>
  </body>
</html>
